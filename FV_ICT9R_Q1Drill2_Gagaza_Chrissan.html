<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            background-color:beige;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif
        }
        header{
            text-align:center;
        }
        section{
        background-color: #fffbc4;
    	padding: 20px;
    	border-radius: 12px;
    	width: 600px;
    	margin: auto;
    	box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        border: 5px solid rgb(234, 191, 35);
        }

        img{
            display: block;
            margin: auto;
            height: 100px;
            width: 100px;
            padding: 0px;
            border-radius: 20px;
            border: 5px solid rgb(255, 231, 144);
         }

        input[type="text"], select, textarea, input[type="submit"] {
            width: 94%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }

        input[type="placeholder"]{
          text-align: center;
    }

    h1{
            color:black;
            background-color: rgb(255, 248, 150);
            font-family:Georgia, 'Times New Roman', Times, serif
        }
    </style>
</head>
<body>
    <header>
        <h1>RATE A MOVIE</h1>
            <br>
        <p>Rate a movie that satisfies your taste!</p>
    </header>

    <br>
    <section>
        <form action="">
            <img src="https://png.pngtree.com/element_our/png/20181227/movie-icon-which-is-designed-for-all-application-purpose-new-png_287896.jpg" alt="logo">
            <br>

            <label for="movie">Movie Title</label>
            <input type="text" id="movie" name="movie" placeholder="Type Here...">

            <br>
            <label for="">Genre/s</label>
            <br>
            <input type="checkbox" id="genre1" name="Genre1" value="Action">
            <label for="genre1">Action</label>

             <input type="checkbox" id="genre2" name="Genre2" value="Sci-fi">
            <label for="genre2">Sci-fi</label>

             <input type="checkbox" id="genre3" name="Genre3" value="Horror">
            <label for="genre3">Horror</label>

             <input type="checkbox" id="genre4" name="Genre4" value="Comedy">
            <label for="genre4">Comedy</label>

            <input type="checkbox" id="genre5" name="Genre5" value="Romance">
            <label for="genre5">Romance</label>

            <br>
            <label for="rating">Rating</label>
            <br>
            <input type="radio" id="rate1" name="rate" value="star1">
            <label for="rate1">⭐</label>

            <input type="radio" id="rate2" name="rate" value="star2">
            <label for="rate2">⭐⭐</label>

            <input type="radio" id="rate3" name="rate" value="star3">
            <label for="rate3">⭐⭐⭐</label>

            <input type="radio" id="rate4" name="rate" value="star4">
            <label for="rate4">⭐⭐⭐⭐</label>

            <input type="radio" id="rate5" name="rate" value="star5">
            <label for="rate5">⭐⭐⭐⭐⭐</label>

            <br>
            <textarea id="review" name="reviw" placeholder="Write a review here..." rows="5" cols="40"></textarea>
            <br>

            <input type="submit" id="submit" name="submit" value="Submit Review">
            <br>

            For movie review tips, click <a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/" target="_blank">here</a>
        </form>
    </section>
</body>
</html>
